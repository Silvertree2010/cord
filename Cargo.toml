[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Silvertree2010/cord"

[workspace.dependencies]
cord-core = { path = "crates/core" }
cord-dc = { path = "crates/dc" }
cord-mx = { path = "crates/mx" }
cord-st = { path = "crates/st" }
cord-store = { path = "crates/store" }
cord-hub = { path = "crates/hub" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream", "gzip", "brotli"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
