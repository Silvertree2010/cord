name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust cmake clang pkgconf qt6-base qt6-declarative qt6-multimedia gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugin-pipewire pipewire libsecret opus
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-
      - name: Build
        run: cargo build -p cord --release
      - name: Test
        run: cargo test --workspace --exclude cord
      - name: Collect
        run: |
          mkdir -p dist/bin dist/share/cord
          cp target/release/cord dist/bin/
          cp -r crates/app/qml dist/share/cord/qml
      - uses: actions/upload-artifact@v4
        with:
          name: cord-linux-x86_64
          path: dist
