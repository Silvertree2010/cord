name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust cmake clang pkgconf qt6-base qt6-declarative qt6-multimedia gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugin-pipewire pipewire libsecret opus
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build -p cord --release
      - name: Package
        run: |
          name="cord-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "$name/bin" "$name/share/cord" "$name/share/applications" "$name/share/icons/hicolor/scalable/apps"
          cp target/release/cord "$name/bin/"
          cp -r crates/app/qml "$name/share/cord/qml"
          cp packaging/cord.desktop "$name/share/applications/"
          cp packaging/cord.svg "$name/share/icons/hicolor/scalable/apps/"
          cp LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
