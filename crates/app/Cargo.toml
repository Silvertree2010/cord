[package]
name = "cord"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
cord-core.workspace = true
cord-hub.workspace = true
cord-store.workspace = true
cord-dc.workspace = true
cord-mx.workspace = true
cord-st.workspace = true
cord-cap.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
dirs = "6"
parking_lot = "0.12"
notify = "8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
notify-rust = "4"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
cxx-qt-build = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
